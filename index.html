<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Professional dog grooming services in Long Beach, CA. One-on-one, crate-free, stress-free grooming by Karen."
    />
    <title>Woof Wash Groom &amp; Go | Dog Grooming in Long Beach, CA</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Hidden mirror of the React intake form so Netlify's build bot
         registers the form and its fields at deploy time. -->
    <form name="new-client" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="owner-name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="referrer-name" />
      <input type="text" name="dog-name" />
      <input type="text" name="breed" />
      <input type="number" name="age" />
      <input type="number" name="weight" />
      <textarea name="concerns"></textarea>
      <input type="checkbox" name="agreement" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
